name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (SQLite + Postgres 16 with RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The tests expect Postgres on a Unix socket in /tmp, port 54329, user postgres with trust auth.
      - name: Start Postgres 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
          sudo systemctl stop postgresql || true
          B=/usr/lib/postgresql/16/bin
          sudo -u postgres mkdir -p /tmp/pgdata
          sudo -u postgres $B/initdb -D /tmp/pgdata -U postgres --auth=trust >/dev/null
          sudo -u postgres $B/pg_ctl -D /tmp/pgdata -o "-p 54329 -k /tmp -c listen_addresses=" -l /tmp/pg.log start
          psql "postgresql://postgres@/postgres?host=/tmp&port=54329" -c "select version()"

      # tests/test_ai.py runs the real AI service next to the app (with a stand-in model)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai/package-lock.json
      - name: Build the AI service
        working-directory: ai
        run: npm ci --no-audit --no-fund && npm run build

      - name: Run tests
        run: python -m pytest tests -q

  web:
    name: Front end (lint, types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ai:
    name: AI service (types, tests, image)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Image builds
        run: docker build -t fasla-ai:ci .

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fasla:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS (eu-north-1)
    needs: [test, web, ai, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write   # lets GitHub hand AWS a short-lived OIDC token; no AWS keys are stored in GitHub
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149320913851:role/fasla-github-deploy
          aws-region: eu-north-1

      - run: npm ci

      - name: Type-check the infrastructure code
        run: npx tsc

      - name: Deploy (builds the Docker image, pushes it to ECR, updates ECS)
        run: npx cdk deploy FaslaApp --require-approval never --outputs-file cdk-outputs.json

      - name: Smoke test
        run: |
          URL=$(node -e "console.log(require('./cdk-outputs.json').FaslaApp.AppUrl)")
          echo "App: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 20); do
            if curl -fsS "$URL/healthz" | tee /tmp/health.json | grep -q '"ok":true' \
               && curl -fsS "$URL/" | grep -q 'what to produce next season' \
               && curl -fsS "$URL/api/config" | grep -q '"authMode"'; then
              cat /tmp/health.json; exit 0
            fi
            sleep 15
          done
          echo "Health check failed"; exit 1
