name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (SQLite + Postgres 16 with RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The tests expect Postgres on a Unix socket in /tmp, port 54329, user postgres with trust auth.
      - name: Start Postgres 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
          sudo systemctl stop postgresql || true
          B=/usr/lib/postgresql/16/bin
          sudo -u postgres mkdir -p /tmp/pgdata
          sudo -u postgres $B/initdb -D /tmp/pgdata -U postgres --auth=trust >/dev/null
          sudo -u postgres $B/pg_ctl -D /tmp/pgdata -o "-p 54329 -k /tmp -c listen_addresses=" -l /tmp/pg.log start
          psql "postgresql://postgres@/postgres?host=/tmp&port=54329" -c "select version()"

      - name: Run tests
        run: python -m pytest tests -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fasla:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
