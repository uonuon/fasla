<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fasla</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%231D4A3E'/%3E%3Ccircle cx='54' cy='40' r='17' fill='%23E6AE3E'/%3E%3Cpath d='M68 46 C 68 64, 58 76, 40 82' fill='none' stroke='%23E6AE3E' stroke-width='11' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: the cutting mat again. Green, gridded panels hold the moments that matter (sign-in, the running plan);
   everything you operate sits on quiet white cards. */
:root{
  --paper:#F2F4F0; --card:#FFFFFF; --ink:#13201B; --ink2:#53625B; --ink3:#86938C; --line:#DCE3DB;
  --mat:#1D4A3E; --mat2:#2A5D4F; --chalk:#E6AE3E; --bad:#C0533D; --badbg:#FBEFEC; --warn:#8A5A0B; --warnbg:#FBF3E2;
  --good:#2E7D57; --goodbg:#E9F4EE;
  --display:"Bricolage Grotesque","Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body)}
[dir=rtl] body{font-family:"Rubik",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--mat)}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.hidden{display:none!important}
.gridbg{background:var(--mat);color:#EEF3EF;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),
  linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--mat);border-color:var(--mat);color:#fff}
.btn.primary:hover{background:var(--mat2)}
.btn.chalk{background:var(--chalk);border-color:var(--chalk);color:#1b1300;font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#E8ECE6}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:10px}
.field{display:grid;gap:6px}
.field label{font-weight:500;font-size:14px}
.field small{color:var(--ink3);font-size:12.5px}
.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
.input:focus{outline:2px solid var(--chalk);outline-offset:0;border-color:transparent}
.err{color:var(--bad);font-size:13.5px}
.note{border-radius:12px;padding:12px 14px;font-size:14px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.good{background:var(--goodbg);color:var(--good)}
h1,h2,h3{text-wrap:balance}
/* auth */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.auth .pitch{padding:48px 56px;display:flex;flex-direction:column;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--display);letter-spacing:-.01em}
.logo small{font:500 12.5px/1 var(--body);color:var(--ink3);margin-inline-start:4px}
.gridbg .logo small{color:#A9C4B9}
.pitch h1{font:800 clamp(34px,4vw,52px)/1.05 var(--display);margin:auto 0 0;letter-spacing:-.02em;max-width:15ch}
.pitch h1 em{font-style:normal;color:var(--chalk)}
.pitch p{color:#BFD3CA;max-width:46ch;margin:0;font-size:16px}
.pitch ul{list-style:none;padding:0;margin:0 0 auto;display:grid;gap:10px;color:#DCE8E2}
.pitch li{display:flex;gap:10px;align-items:flex-start}
.pitch li b{color:var(--chalk);font:700 14px/1.6 var(--display)}
.auth .panel{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.authcard{width:100%;max-width:400px;display:grid;gap:18px}
.tabs{display:flex;background:#E7EBE5;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--ink2)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* shell */
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10}
.spacer{flex:1}
.menu{position:relative}
.menu .pop{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.1);min-width:240px;padding:6px;display:none;z-index:20}
.menu.open .pop{display:block}
.pop .item{display:flex;width:100%;text-align:start;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;gap:8px;align-items:center}
.pop .item:hover{background:#F1F4F0}
.pop .sep{height:1px;background:var(--line);margin:6px 4px}
.pop .meta{padding:8px 12px;color:var(--ink3);font-size:13px;word-break:break-all}
.brandbtn{font-weight:600}
main{max-width:1120px;margin:0 auto;padding:28px 22px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.stack{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title h1{font:800 30px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.steps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}
.step{display:grid;gap:12px;align-content:start}
.step h2{font:700 19px/1.25 var(--display);margin:0;display:flex;gap:10px;align-items:center}
.num{width:28px;height:28px;border-radius:50%;background:var(--mat);color:#fff;display:inline-grid;place-items:center;font:700 13px/1 var(--display);flex:none}
.step p{margin:0;color:var(--ink2)}
.sheetlist{display:grid;gap:6px;font-size:13.5px;color:var(--ink2);margin:2px 0 0;padding:0;list-style:none}
.sheetlist b{color:var(--ink);font-weight:600}
.drop{border:2px dashed #C7D1C6;border-radius:16px;padding:28px 18px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s;display:grid;gap:8px;justify-items:center}
.drop:hover,.drop.over{background:#F3F7F2;border-color:var(--mat)}
.drop b{font:700 17px/1.3 var(--display)}
.drop span{color:var(--ink3);font-size:13.5px}
.bar{height:8px;background:#E7EBE5;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mat);width:0;transition:width .2s}
table.list{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.list th{font:600 11.5px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:start;padding:0 10px 10px}
.list td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}
.list tr.row{cursor:pointer}
.list tr.row:hover td{background:#F8FAF7}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.done{background:var(--goodbg);color:var(--good)}
.chip.running,.chip.queued{background:var(--warnbg);color:var(--warn)}
.chip.failed{background:var(--badbg);color:var(--bad)}
.chip.draft{background:#EEF1ED;color:var(--ink2)}
.empty{text-align:center;color:var(--ink3);padding:26px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#F3F6F2;border-radius:12px;padding:10px 14px}
.stat b{display:block;font:700 20px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.run{padding:34px 30px;border-radius:22px;display:grid;gap:20px}
.run h2{font:800 30px/1.1 var(--display);margin:0}
.runsteps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.runsteps li{display:flex;align-items:center;gap:12px;color:#A9C4B9}
.runsteps li.on{color:#fff}
.runsteps li.ok{color:#CFE0D8}
.runsteps i{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;flex:none;font-style:normal;font-size:12px}
.runsteps li.ok i{background:var(--chalk);border-color:var(--chalk);color:#1b1300}
.runsteps li.on i{border-color:var(--chalk);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.planbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
iframe.results{width:100%;border:0;display:block;min-height:900px}
.modal{position:fixed;inset:0;background:rgba(19,32,27,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal .card{max-width:440px;width:100%;display:grid;gap:14px}
.modal h3{margin:0;font:700 19px/1.3 var(--display)}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
[dir=rtl] .toast{transform:translateX(50%)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink3)}
@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth .pitch{padding:32px 24px;gap:18px}
  .pitch h1{margin-top:4px;font-size:30px}
  .pitch ul,.pitch p{display:none}
  .auth .panel{align-items:flex-start;padding-top:24px}
  .steps,.form{grid-template-columns:minmax(0,1fr)}
  .top{gap:6px}.top .logo span{display:none}.top .btn{padding:6px 9px}
  .btn{white-space:normal;text-align:center}
  .title h1{font-size:25px}
  .planbar .btn{flex:1 1 auto}
  .card{padding:18px 16px}
  body{overflow-x:hidden}
  .hide-sm{display:none}
  main{padding:20px 14px 50px}
  .top{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

async function devAuth(kind,email,password){

/* ---------------- api ---------------- */
async function api(path,opt={}){
  const s=await Auth.session();
  if(!s){location.hash="#/login";throw new Error("auth")}
  const h={...(opt.headers||{}),Authorization:"Bearer "+s.token};
  if(opt.json!==undefined){h["Content-Type"]="application/json";opt.body=JSON.stringify(opt.json)}
  let r;try{r=await fetch(path,{...opt,headers:h})}catch(e){toast(t("errNet"));throw e}
  if(r.status===401){await Auth.signOut();toast(t("err401"));location.hash="#/login";throw new Error("auth")}
  return r;
}
async function apiJson(path,opt){const r=await api(path,opt);const j=await r.json().catch(()=>({}));if(!r.ok){const m=typeof j.detail==="string"?j.detail:(j.errors||[]).join(" ")||r.statusText;throw Object.assign(new Error(m),{status:r.status,body:j})}return j}
async function download(path,fallbackName){
  const r=await api(path);if(!r.ok){toast((await r.json().catch(()=>({}))).detail||"Download failed");return}
  const b=await r.blob();const cd=r.headers.get("content-disposition")||"";const m=cd.match(/filename="([^"]+)"/);
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=m?m[1]:fallbackName;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function toast(msg){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}
function confirmBox(title,text,okLabel){return new Promise(res=>{
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p style="margin:0;color:var(--ink2)">${esc(text)}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="mNo">${t("cancel")}</button><button class="btn primary" id="mOk" style="background:var(--bad);border-color:var(--bad)">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);const done=v=>{m.remove();res(v)};m.querySelector("#mNo").onclick=()=>done(false);m.querySelector("#mOk").onclick=()=>done(true);
  m.onclick=e=>{if(e.target===m)done(false)};m.querySelector("#mOk").focus();addEventListener("keydown",function k(e){if(e.key==="Escape"){removeEventListener("keydown",k);done(false)}})})}
function promptBox(title,label,value){return new Promise(res=>{
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<form class="card"><h3>${esc(title)}</h3><div class="field"><label for="pIn">${esc(label)}</label><input class="input" id="pIn" maxlength="80" required value="${esc(value||"")}"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn" id="pNo">${t("cancel")}</button><button class="btn primary">${t("saved")==="Saved"?"Save":"حفظ"}</button></div></form>`;
  document.body.appendChild(m);const f=m.querySelector("form");const done=v=>{m.remove();res(v)};
  m.querySelector("#pNo").onclick=()=>done(null);f.onsubmit=e=>{e.preventDefault();done(m.querySelector("#pIn").value.trim()||null)};m.querySelector("#pIn").select()})}

/* ---------------- router ---------------- */
let state={brands:null,user:null,poll:null};
function stopPoll(){if(state.poll){clearTimeout(state.poll);state.poll=null}}
async function route(){
  stopPoll();
  const h=location.hash||"#/";
  if(h.startsWith("#/reset"))return viewReset();
  if(h.includes("access_token")||h.includes("error_description"))return;  // Supabase finishing a redirect
  const s=await Auth.session();
  if(h.startsWith("#/login")||!s){if(s){location.hash="#/";return}return viewAuth()}
  state.user=s;
  const m=h.match(/^#\/(b|p)\/([0-9a-f-]{36})/);
  try{
    if(!state.brands)state.brands=await apiJson("/api/brands");
    if(m&&m[1]==="b")return viewBrand(m[2]);
    if(m&&m[1]==="p")return viewPlan(m[2]);
    if(!state.brands.length)return viewOnboard();
    let last=null;try{last=localStorage.getItem("fasla.brand")}catch(e){}
    const b=state.brands.find(x=>x.id===last)||state.brands[0];location.hash="#/b/"+b.id;
  }catch(e){if(e.message!=="auth")shell(`<div class="card empty">${esc(e.message)}</div>`)}
}
addEventListener("hashchange",route);

  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!await confirmBox(t("delPlanQ"),t("delPlanP"),t("del")))return;
    const r=await api("/api/plans/"+b.dataset.del,{method:"DELETE"});if(r.ok){toast(t("deleted"));loadPlans(bid)}else toast((await r.json()).detail)});
  if(ps.some(p=>p.status==="queued"||p.status==="running"))state.poll=setTimeout(()=>loadPlans(bid),4000);
}
function upload(bid,f){
  const err=$("#uperr");err.innerHTML="";
  if(!/\.xlsx$/i.test(f.name)){err.innerHTML=`<div class="note bad">${L==="ar"?"ارفع ملف إكسل .xlsx":"Please upload an Excel .xlsx file."}</div>`;return}
  if(f.size>(CFG.maxUploadMb||10)*1048576){err.innerHTML=`<div class="note bad">${L==="ar"?"الملف أكبر من المسموح":"The file is too large."}</div>`;return}
  Auth.session().then(s=>{
    const fd=new FormData();fd.append("file",f);
    const x=new XMLHttpRequest();x.open("POST",`/api/brands/${bid}/uploads`);x.setRequestHeader("Authorization","Bearer "+s.token);
    $("#upst").classList.remove("hidden");$("#drop").classList.add("hidden");
    x.upload.onprogress=e=>{if(e.lengthComputable)$("#upbar").style.width=(e.loaded/e.total*90)+"%"};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}
      $("#upbar").style.width="100%";
      if(x.status===201){location.hash="#/p/"+j.plan_id;return}
      $("#upst").classList.add("hidden");$("#drop").classList.remove("hidden");$("#file").value="";
      if(x.status===401){toast(t("err401"));location.hash="#/login";return}
      const errs=j.errors||[j.detail||x.statusText];
      err.innerHTML=`<div class="note bad"><b>${t("fixFile")}</b><br>${t("fixFileP")}<ul style="margin:6px 0 0;padding-inline-start:18px">${errs.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`};
    x.onerror=()=>{$("#upst").classList.add("hidden");$("#drop").classList.remove("hidden");toast(t("errNet"))};
    x.send(fd);
  });
}

/* ---------------- plan ---------------- */
const FIELDS=[["budget","num",1000],["factory_moq","int",1],["min_per_color","int",1],["leftover_share","pct",1],["start_cash","num",1000],["deposit_share","pct",1],["lead_weeks","int",1],["ads_share","pct",1],["fixed_weekly","num",500]];
async function viewPlan(pid){
  let p;try{p=await apiJson("/api/plans/"+pid)}catch(e){if(e.status===404)return shell(`<div class="card empty">${t("notFound")} <a href="#/">${t("home")}</a></div>`);throw e}
  const bid=p.brand_id;
  const head=`<div class="title"><a class="btn sm ghost" href="#/b/${bid}">${L==="ar"?"→":"←"} ${t("backBrand")}</a><div class="spacer"></div><span class="chip ${p.status}">${t("st_"+p.status)}</span></div>`;
  if(p.status==="queued"||p.status==="running")return viewRunning(p,head);
  if(p.status==="done")return viewDone(p,head);
  return viewReview(p,head);
}
function viewReview(p,head){
  const st=(p.checks&&p.checks.stats)||{},w=(p.checks&&p.checks.warnings)||[],s=p.settings||{};
  const val=(k,kind)=>kind==="pct"?Math.round((s[k]||0)*1000)/10:s[k];
  shell(`<div class="stack">${head}
    ${p.status==="failed"?`<div class="note bad"><b>${t("failedH")}</b><br>${esc(p.error||"")}</div>`:""}
    <section class="card stack"><div><div class="eyebrow">${esc(p.input_name)}</div><h1 style="font:800 28px/1.15 var(--display);margin:6px 0 4px">${t("review")}</h1><p style="margin:0;color:var(--ink2)">${t("reviewP")}</p></div>
      <div class="stats">${[[fmt(st.orders||0),t("orders")],[st.styles,t("styles")],[(st.seasons||[]).length,t("seasons")],[(st.couriers||[]).length,t("couriersN")],[st.zones,t("zonesN")],[st.owner_estimates||0,t("estimates")]]
        .map(([a,b])=>`<div class="stat"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}
        <div class="stat"><b style="font-size:15px">${esc(st.date_from||"")} → ${esc(st.date_to||"")}</b><span>${esc((st.seasons||[]).join(" · "))}</span></div></div>
      ${w.length?`<div class="note warn"><b>${t("warnings")}</b><ul style="margin:6px 0 0;padding-inline-start:18px">${w.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    </section>
    <form class="card stack" id="sf" novalidate><h2 style="font:700 19px/1.2 var(--display);margin:0">${t("settings")}</h2>
      <div class="form">${FIELDS.map(([k,kind,step])=>`<div class="field"><label for="f_${k}">${t("f_"+k)}</label><input class="input" id="f_${k}" type="number" inputmode="decimal" step="${kind==="pct"?0.5:step}" value="${esc(val(k,kind))}" required><small>${t("h_"+k)}</small></div>`).join("")}</div>
      <div class="err" id="er" role="alert"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn chalk" id="go">▶ ${t("runPlan")}</button><a class="btn" href="#/b/${p.brand_id}">${t("replace")}</a></div></form>
  </div>`,p.brand_id);
  $("#sf").onsubmit=async e=>{e.preventDefault();const out={};
    for(const[k,kind] of FIELDS){const v=parseFloat($("#f_"+k).value);if(!isFinite(v)){$("#er").textContent=t("f_"+k)+" ?";return}out[k]=kind==="pct"?v/100:v}
    $("#go").disabled=true;$("#er").textContent="";
    try{await apiJson(`/api/plans/${p.id}/run`,{method:"POST",json:{settings:out}});viewPlan(p.id)}
    catch(er){$("#er").textContent=er.message;$("#go").disabled=false}};
}
function viewRunning(p,head){
  const steps=["r1","r2","r3","r4","r5","r6"];
  shell(`<div class="stack">${head}<section class="run gridbg" aria-live="polite"><div class="eyebrow" style="color:#A9C4B9">${esc(p.input_name)}</div>
    <h2>${t("runningH")}</h2><p style="margin:0;color:#BFD3CA">${t("runningP")}</p>
    <ul class="runsteps" id="rs">${steps.map(k=>`<li><i></i>${t(k)}</li>`).join("")}</ul>
    <div style="color:#A9C4B9;font-variant-numeric:tabular-nums" id="el"></div></section></div>`,p.brand_id);
  const t0=Date.now(),est=[3,8,14,55,75,90];
  const tick=async()=>{const s=(Date.now()-t0)/1000;
    const i=est.findIndex(x=>s<x);document.querySelectorAll("#rs li").forEach((li,j)=>{li.className=j<(i<0?5:i)?"ok":j===(i<0?5:i)?"on":"";li.querySelector("i").textContent=li.className==="ok"?"✓":""});
    if($("#el"))$("#el").textContent=Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
    if(Math.round(s)%2===0){try{const q=await apiJson("/api/plans/"+p.id);if(q.status!=="queued"&&q.status!=="running"){viewPlan(p.id);return}}catch(e){}}
    state.poll=setTimeout(tick,1000)};
  tick();
}
function viewDone(p,head){
  const v=p.view,b=v.variants[v.base];
  shell(`<div class="stack">${head}
    <div class="planbar"><div><div class="eyebrow">${esc(p.input_name)} · ${dt(p.finished_at||p.created_at)}</div>
      <h1 style="font:800 26px/1.15 var(--display);margin:4px 0 0">${t("planOf",{d:dt(p.created_at)})}</h1></div><div class="spacer"></div>
      <button class="btn primary" id="rep">⤓ ${t("report")}</button><button class="btn" id="inp">⤓ ${t("input")}</button><button class="btn" id="again">${t("runAgain")}</button></div>
    <iframe class="results" id="res" title="Plan" src="/static/results.html?embed=1"></iframe></div>`,p.brand_id);
  $("#rep").onclick=()=>download(`/api/plans/${p.id}/report`,"fasla_report.xlsx");
  $("#inp").onclick=()=>download(`/api/plans/${p.id}/input`,"fasla_input.xlsx");
  $("#again").onclick=()=>viewReview({...p,status:"draft"},head.replace(/chip done/,"chip draft"));
  const fr=$("#res");
  const send=()=>fr.contentWindow.postMessage({type:"plan",data:v,lang:L},location.origin);
  window.onmessage=e=>{if(e.origin!==location.origin||e.source!==fr.contentWindow)return;
    if(e.data.type==="ready")send();if(e.data.type==="height")fr.style.height=(e.data.h+20)+"px"};
}
route();
</script>
